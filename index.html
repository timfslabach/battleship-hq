<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Battleship HQ</title>
<meta name="description" content="Battleship, except every shot costs you a run. Powered by Strava.">

<!-- the home-screen icon. This is the whole reason this page exists:
     Apps Script silently drops these, a page you own does not. -->
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="manifest" href="site.webmanifest">
<meta name="apple-mobile-web-app-title" content="Battleship HQ">
<meta name="theme-color" content="#0e2436">

<!-- what a text message shows instead of a grey script.google.com box -->
<meta property="og:type" content="website">
<meta property="og:title" content="Battleship HQ">
<meta property="og:description" content="Battleship, except every shot costs you a run. Powered by Strava.">
<meta property="og:image" content="og.png">
<meta name="twitter:card" content="summary_large_image">

<style>
  :root{ --deep:#0e2436; --ink:#f4ecd8; --dim:#8fb0c2; --hot:#e0431c; --line:#24455c;
         --mono:ui-monospace,SFMono-Regular,Menlo,monospace; color-scheme:dark }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--deep);color:var(--ink);
       font:400 16px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
       display:flex;align-items:center;justify-content:center;padding:24px 16px}
  .card{width:100%;max-width:400px;text-align:center}
  img.mark{width:104px;height:104px;border-radius:22px;display:block;margin:0 auto 20px}
  h1{font:800 40px/1 Impact,"Arial Narrow",var(--mono);letter-spacing:.01em;margin:0 0 8px;text-transform:uppercase}
  .tag{font:600 11px var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--dim);margin:0 0 22px}
  p{color:#c3d4de;margin:0 0 26px}
  a.go{display:block;background:var(--hot);color:#fff;text-decoration:none;
       font:700 15px var(--mono);letter-spacing:.06em;text-transform:uppercase;
       padding:15px 20px;border-radius:11px}
  a.go:hover{filter:brightness(1.08)}
  .fine{margin:22px 0 0;font:500 12px var(--mono);letter-spacing:.06em;color:#5d8298}
  .fine a{color:#5d8298}
</style>
</head>
<body>
  <div class="card">
    <img class="mark" src="icon-180.png" alt="">
    <h1>Battleship HQ</h1>
    <p class="tag">Run it to fire it</p>
    <p>Battleship, except every shot costs you a run.</p>
    <a class="go" id="go" href="https://script.google.com/macros/s/AKfycbxTwXOoFDQDzHdhsJmTvWgWWVUVGDS61T_ngYo5QPc8YZGQCzEC1v_Hd8GyObtf2N7K/exec">Open the game</a>
    <p class="fine">Powered by Strava</p>
  </div>
<script>
  /* Straight through to the game, unless the URL ends in #stay — which is how you sit on
     this page long enough to add it to your home screen.
     The #stay is scrubbed out of the address bar immediately, because Safari's "Add to
     Home Screen" saves whatever URL is showing. Leave the hash in and the icon parks you
     on this page forever instead of carrying you through to the game. */
  if (location.hash === '#stay') {
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
  } else {
    setTimeout(function () { location.replace(document.getElementById('go').href); }, 600);
  }
</script>
</body>
</html>
